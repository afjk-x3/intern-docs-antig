name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type Check
      run: npx tsc --noEmit

    # Ensure no secrets are checked in (trufflehog or similar can be used here)
    - name: Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    # Same rule set as the local pre-commit hook (.husky/pre-commit), so a bypassed
    # local hook (--no-verify) still gets caught here (12-backend-security-rules.md §10).
    - name: Secretlint
      run: npx secretlint "**/*"

    # __tests__/auth/rls-integration.test.ts (FR-26, docs/05-security.md §8) asserts
    # real Postgres RLS behavior, not mocked responses -- it needs a live instance with
    # this repo's actual migrations applied. `supabase start` applies them automatically.
    # This is what makes the FR-26 suite genuinely merge-blocking (01-tasks.md,
    # 02-dev-guide.md) rather than just green against its own assumptions.
    - name: Start local Supabase
      run: npx supabase start

    - name: Run tests
      run: npm run test

    # Closes audit gap #14 (docs/09-project-audit.md): Playwright was locked into the
    # stack (prd-intern-docflow.md §10) but never installed. e2e/accessibility.spec.ts
    # makes the WCAG scan a standing gate instead of a manual one-off; e2e/smoke.spec.ts
    # covers the unauthenticated routing/auth-error surface. Local Supabase (started
    # above) is still running, so the app under test can reach it -- same well-known,
    # public local-dev demo keys the RLS integration suite already uses (never valid
    # outside a local Docker instance, safe to inline here).
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright (E2E + accessibility)
      run: npx playwright test
      env:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Stop local Supabase
      if: always()
      run: npx supabase stop
