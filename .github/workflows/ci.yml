name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type Check
      run: npx tsc --noEmit

    # Ensure no secrets are checked in (trufflehog or similar can be used here)
    - name: Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    # Same rule set as the local pre-commit hook (.husky/pre-commit), so a bypassed
    # local hook (--no-verify) still gets caught here (12-backend-security-rules.md §10).
    - name: Secretlint
      run: npx secretlint "**/*"

    # __tests__/auth/rls-integration.test.ts (FR-26, docs/05-security.md §8) asserts
    # real Postgres RLS behavior, not mocked responses -- it needs a live instance with
    # this repo's actual migrations applied. `supabase start` applies them automatically.
    # This is what makes the FR-26 suite genuinely merge-blocking (01-tasks.md,
    # 02-dev-guide.md) rather than just green against its own assumptions.
    - name: Start local Supabase
      run: npx supabase start

    - name: Run tests
      run: npm run test

    - name: Stop local Supabase
      if: always()
      run: npx supabase stop
